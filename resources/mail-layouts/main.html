<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifica</title>
    <style>
        /* Reset CSS */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f4;
        }
        
        /* Container principale */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #ffffff;
        }
        
        /* Header */
        .header {
            text-align: center;
            padding: 20px 0;
            background-color: #0066cc;
            color: #ffffff;
        }
        
        /* Logo */
        .logo {
            max-width: 200px;
            height: auto;
        }
        
        /* Contenuto */
        .content {
            padding: 20px;
            color: #333333;
        }
        
        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            background-color: #f8f8f8;
            color: #666666;
            font-size: 12px;
        }
        
        /* Bottoni */
        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #0066cc;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        /* Responsive */
        @media only screen and (max-width: 600px) {
            .container {
                width: 100% !important;
            }
            
            .content {
                padding: 10px !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="{{logo_url}}" alt="Logo" class="logo">
        </div>
        
        <div class="content">
            {{{ body }}}
        </div>
        
        <div class="footer">
            <p>© {{year}} {{app_name}}. Tutti i diritti riservati.</p>
            <p>Questo è un messaggio automatico, si prega di non rispondere.</p>
        </div>
    </div>
</body>
</html>
